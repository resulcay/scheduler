name: scheduler
description: An event-tracking app.

publish_to: 'none'

version: 1.1.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  intl: ^0.20.2
  quickalert: ^1.1.0
  flutter_colorpicker: ^1.1.0
  stacked_card_carousel: ^0.0.4
  flutter_svg: ^2.3.2
  rect_getter: ^1.1.0
  flutter_alarm_clock: ^0.1.2
  easy_localization: ^3.0.7
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.6
  flutter_driver:
    sdk: flutter

flutter_native_splash:
  image: assets/images/app_icon.png
  color: "#297373"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

  fonts:
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf
